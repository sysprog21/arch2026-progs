name: CI

# A branch push runs the checks once. A pull request from a branch of the same
# repository is skipped (its push run covers the same commit); a pull request
# from a fork runs, because no push event reaches this repository for it.
on:
  push:
    branches: ['**']
  pull_request:
  # A fork can start a run by hand, e.g. after enabling Actions there.
  workflow_dispatch:

permissions:
  contents: read

# Newer pushes cancel older runs, except on main: every graded commit keeps its
# result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CLANG_FORMAT_VERSION: 20.1.8
  # Hosted runners have 4 cores (2 on private repositories); the builds are
  # independent per level, so oversubscribing a little is harmless.
  MAKEFLAGS: -j4

jobs:
  # Source hygiene needs neither the cross toolchain nor the emulator.
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: newline
      run: .ci/newline.sh
    - name: unit tests of the scripts
      run: make unittest
    - name: clang-format 20
      run: |
        pipx install "clang-format==${CLANG_FORMAT_VERSION}"
        CLANG_FORMAT=clang-format .ci/format.sh

  # The hash chain of Change-Ids needs the whole history, and a pull request
  # must be checked as its own head, not as the merge commit GitHub makes.
  chain:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    # The submission must not be the judge of its own history: verify the chain
    # with the scripts of the instructor's repository first. A missing verifier
    # is a failure, never a reason to skip.
    - uses: actions/checkout@v7
      with:
        repository: sysprog21/arch2026-progs
        ref: main
        path: .trusted
        persist-credentials: false
    - name: hash chain, instructor's scripts
      run: |
        for f in scripts/chain.sh scripts/common.sh tools/hashchain.c; do
          test -f ".trusted/$f" || {
            echo "::error::sysprog21/arch2026-progs main has no $f; the instructor's verifier is not published"
            exit 1
          }
        done
        # Stay in the submission root: the verifier checks its history.
        env -u CHAIN_BASE -u CHAIN_TOOL -u CHAIN_EXEMPT CC=/usr/bin/cc bash .trusted/scripts/chain.sh verify
    - name: hash chain, submission's scripts
      run: scripts/chain.sh verify
    # The self-test takes about a minute. It exercises the verifier, so it runs
    # only when the submission changed scripts/ or tools/.
    - name: self-test of an edited verifier
      run: |
        if diff -rq .trusted/scripts scripts >/dev/null &&
           diff -rq .trusted/tools tools >/dev/null; then
          echo "scripts/ and tools/ match the instructor's: self-test skipped"
        else
          make chaintest
        fi

  # The grade: host tests under sanitizers, then the RV32I build and the
  # micro-test suites on rv32emu at all four levels. The harness (tests,
  # budgets, vectors, scripts, Makefile) is the instructor's, from main; only
  # src/<prog>/ comes from the submission, so editing a test or a budget in a
  # fork changes nothing. The emulator is built from the instructor's rules too.
  # The instructor's repository holds the skeleton, which scores 0 by design,
  # so it is not graded here: main is covered by the reference job below, and a
  # pull request that changes the harness by the manual reference-pr workflow.
  grade:
    if: >-
      github.repository != 'sysprog21/arch2026-progs' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/checkout@v7
      with:
        repository: sysprog21/arch2026-progs
        ref: main
        path: .trusted
        persist-credentials: false
    - name: instructor's harness is published
      run: |
        for f in scripts/grade.sh scripts/driver.py tests/tgcd.c src/rubik/rubik.h; do
          test -f ".trusted/$f" || {
            echo "::error::sysprog21/arch2026-progs main has no $f; the instructor's harness is not published"
            exit 1
          }
        done
    - uses: ./.github/actions/rv32-env
    - name: grade
      run: |
        .trusted/scripts/grade.sh --submission . --out results
    - name: cycle charts exist
      if: ${{ !cancelled() }}
      run: |
        for chart in cycles-per-call speedup footprint; do
          test -s "results/$chart.png"
        done
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: cycles
        path: results/

  # The reference solutions live in a private repository. Only this job holds
  # its read-only deploy key, as a secret of the protected Environment
  # "reference", which accepts the branch main alone; no other branch, no pull
  # request and no fork ever receives it. The job runs the code of main, which
  # is reviewed, and prints only the name and total of each case: a build error
  # would quote the reference, so no log and no artifact is kept.
  reference:
    if: github.event_name == 'push' && github.repository == 'sysprog21/arch2026-progs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: reference
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        path: .trusted
        persist-credentials: false
    - uses: ./.github/actions/rv32-env
    - name: provision the reference solutions
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        .trusted/.ci/provision.sh "$RUNNER_TEMP/reference"
        test -d "$RUNNER_TEMP/reference/src" || {
          echo "::error::no reference solutions: the Environment reference lacks SSH_PRIVATE_KEY"
          exit 1
        }
    # The reference must score 100, the untouched skeleton 0, and every
    # negative case of the private repository what its "expect" file says.
    - name: check the grader
      run: .trusted/.ci/check-grade.sh .trusted/scripts/grade.sh "$RUNNER_TEMP/reference" .

  # One result to read, and to require in a branch protection rule. A skipped
  # job (a same-repository pull request) counts as passed.
  ci:
    if: ${{ always() }}
    needs: [lint, chain, grade, reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - run: |
        echo '${{ toJSON(needs) }}'
        ! echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'
