name: CI

on: [push, pull_request]

env:
  XPACK_GCC: 15.2.0-1

jobs:
  grade:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: install-dependencies
      run: |
        sudo apt-get update
        sudo apt-get -q -y install build-essential cppcheck device-tree-compiler \
            python3-matplotlib libsdl2-dev
        url=https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${XPACK_GCC}/xpack-riscv-none-elf-gcc-${XPACK_GCC}-linux-x64.tar.gz
        curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/xpack-riscv-none-elf-gcc-${XPACK_GCC}/bin" >> "$GITHUB_PATH"
    - name: toolchain
      run: make toolchain
    - name: make
      run: make
    - name: sanitizers
      run: make sanitize
    - name: make test
      run: make test
    - name: cycle analysis
      run: make cycles
    - uses: actions/upload-artifact@v4
      with:
        name: cycles
        path: results/

  coding-style:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: coding convention
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        sudo apt-get install -q -y clang-format-20
        .ci/newline.sh
        .ci/format.sh
      shell: bash
